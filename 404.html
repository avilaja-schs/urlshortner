<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening link…</title>
<!--
  HOW THIS WORKS (you don't need to edit this file):
  GitHub Pages shows this page whenever someone visits an address that
  isn't a real file, like scavila.github.io/test1.
  The script reads the "test1" part, looks it up in links.js, and sends
  the visitor to the long address. If the code isn't found, it shows a
  friendly "link not found" message instead.
-->
<style>
  :root { --bg:#f6f8fa; --card:#fff; --ink:#1b1f24; --muted:#57606a; --accent:#0a6ebd; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --card:#161b22; --ink:#e6edf3; --muted:#9da7b3; --accent:#58a6ff; }
  }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
         color:var(--ink); font:18px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; box-sizing:border-box; }
  .card { background:var(--card); max-width:480px; width:100%; padding:28px; border-radius:14px;
          box-shadow:0 2px 10px rgba(0,0,0,.08); text-align:center; }
  h1 { font-size:1.4rem; margin:0 0 .5rem; }
  p { color:var(--muted); margin:.5rem 0; }
  code { background:var(--bg); padding:2px 8px; border-radius:6px; font-size:1.1rem; color:var(--ink); }
  a { color:var(--accent); }
</style>
<script src="/links.js"></script>
</head>
<body>
<main class="card" aria-live="polite">
  <h1 id="title">Opening your link…</h1>
  <p id="msg">One moment.</p>
</main>
<script>
  // 1. Take the last part of the address, e.g. "/Test1/" -> "test1".
  //    Lowercasing means a student who types capitals still gets there.
  const parts = location.pathname.split("/").filter(Boolean);
  const code = (parts[parts.length - 1] || "").toLowerCase().trim();

  // 2. Look it up. (LINKS comes from links.js; guard in case it failed to load.)
  const table = (typeof LINKS === "object" && LINKS) ? LINKS : {};
  const target = Object.prototype.hasOwnProperty.call(table, code) ? table[code] : null;

  if (target) {
    // 3a. Found it: go. replace() keeps the Back button working normally.
    location.replace(target);
  } else {
    // 3b. Not found: show a clear message (textContent = safe, no HTML injection).
    document.title = "Link not found";
    document.getElementById("title").textContent = "Link not found";
    const msg = document.getElementById("msg");
    msg.textContent = "";
    if (code) {
      msg.append("We couldn't find the code ");
      const c = document.createElement("code");
      c.textContent = code;
      msg.append(c, ". Check the spelling and try again, or ask your teacher.");
    } else {
      msg.textContent = "Check the spelling and try again, or ask your teacher.";
    }
  }
</script>
<noscript><p style="text-align:center">Please turn on JavaScript to open this link.</p></noscript>
</body>
</html>
