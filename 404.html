<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening link…</title>
<!--
  HOW THIS WORKS (you don't need to edit this file):
  GitHub Pages shows this page whenever someone visits an address that
  isn't a real file, like  avilaja-schs.github.io/urlshortner/density
  The script takes the last part ("density"), loads links.js from the
  same folder, and sends the visitor to the long address.
  If the code isn't found, it shows a friendly "link not found" message.
-->
<style>
  :root { --bg:#f6f8fa; --card:#fff; --ink:#1b1f24; --muted:#57606a; --accent:#0a6ebd; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --card:#161b22; --ink:#e6edf3; --muted:#9da7b3; --accent:#58a6ff; }
  }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
         color:var(--ink); font:18px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; box-sizing:border-box; }
  .card { background:var(--card); max-width:480px; width:100%; padding:28px; border-radius:14px;
          box-shadow:0 2px 10px rgba(0,0,0,.08); text-align:center; }
  h1 { font-size:1.4rem; margin:0 0 .5rem; }
  p { color:var(--muted); margin:.5rem 0; }
  code { background:var(--bg); padding:2px 8px; border-radius:6px; font-size:1.1rem; color:var(--ink); }
</style>
</head>
<body>
<main class="card" aria-live="polite">
  <h1 id="title">Opening your link…</h1>
  <p id="msg">One moment.</p>
</main>
<noscript><p style="text-align:center">Please turn on JavaScript to open this link.</p></noscript>
<script>
  // 1. Split the address. "/urlshortner/Density/" -> folder "/urlshortner/", code "density".
  //    Lowercasing means a student who types capitals still gets there.
  const parts = location.pathname.split("/").filter(Boolean);
  const code = (parts.pop() || "").toLowerCase().trim();
  const folder = "/" + parts.map(p => p + "/").join("");

  function notFound() {
    document.title = "Link not found";
    document.getElementById("title").textContent = "Link not found";
    const msg = document.getElementById("msg");
    msg.textContent = "";
    if (code) {
      msg.append("We couldn't find the code ");
      const c = document.createElement("code");
      c.textContent = code;                      // textContent = safe, no HTML injection
      msg.append(c, ". Check the spelling and try again, or ask your teacher.");
    } else {
      msg.textContent = "Check the spelling and try again, or ask your teacher.";
    }
  }

  function go() {
    const table = (typeof LINKS === "object" && LINKS) ? LINKS : {};
    const entry = Object.prototype.hasOwnProperty.call(table, code) ? table[code] : null;
    // Entries are {url, added, note}. (Old plain "code": "url" lines also work.)
    const target = typeof entry === "string" ? entry : (entry && entry.url) || null;
    if (target) location.replace(target);        // replace() keeps the Back button normal
    else notFound();
  }

  // 2. Load links.js from the same folder. The "?v=" + time part skips the
  //    browser's saved copy, so brand-new links work right away.
  const s = document.createElement("script");
  s.src = folder + "links.js?v=" + Date.now();
  s.onload = go;
  s.onerror = notFound;
  document.head.append(s);
</script>
</body>
</html>
